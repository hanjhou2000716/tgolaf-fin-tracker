name: Growth Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.22", "3.13.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock
      - name: Install locked production dependencies
        if: matrix.python-version == '3.10.22'
        run: python -m pip install --requirement requirements.lock --requirement requirements-test.lock
      - name: Install compatibility-test dependencies
        if: matrix.python-version == '3.13.11'
        run: python -m pip install requests==2.31.0 cryptography==50.0.2 --requirement requirements-test.lock
      - name: Run full unittest suite on production Python
        if: matrix.python-version == '3.10.22'
        run: python -m unittest discover -s tests -v
      - name: Run full pytest suite on production Python
        if: matrix.python-version == '3.10.22'
        run: python -m pytest -q
      - name: Run date and notification compatibility suite on Python 3.13
        if: matrix.python-version == '3.13.11'
        run: |
          python -m unittest discover -s tests -p 'test_beta_policy.py' -v
          python -m unittest discover -s tests -p 'test_telegram_delivery.py' -v
      - name: Validate Pages publisher CLI on production Python
        if: matrix.python-version == '3.10.22'
        run: python pages_publication.py --help
      - name: Build and audit the static Demo
        run: python quality_site_checks.py
