name: Portfolio Data Freshness Watchdog

on:
  repository_dispatch:
    types: [health_check]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate health without sending a Telegram alert"
        type: boolean
        required: true
        default: true
  # External Cornjob is primary at 08:00 / 17:00 Asia/Taipei. These are backups.
  schedule:
    - cron: "15 0 * * *"
    - cron: "15 9 * * *"

concurrency:
  group: portfolio-data-freshness-watchdog
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install watchdog dependency
        run: python -m pip install --requirement requirements.lock
      - name: Check Growth and Skynet freshness
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HEALTH_WATCHDOG_STATE_FILE: ${{ runner.temp }}/health-watchdog-state.json
          HEALTH_CHECK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python health_check.py
      - name: Save non-sensitive incident state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-watchdog-state
          path: ${{ runner.temp }}/health-watchdog-state.json
          if-no-files-found: error
          retention-days: 30
