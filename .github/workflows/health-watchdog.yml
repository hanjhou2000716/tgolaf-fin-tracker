name: Portfolio Data Freshness Watchdog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate health without sending a Telegram alert"
        type: boolean
        required: true
        default: true
  # 08:00 and 17:00 Asia/Taipei every calendar day.
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install watchdog dependency
        run: python -m pip install --requirement requirements.lock
      - name: Check Growth and Skynet freshness
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTH_CHECK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python health_check.py
