name: Portfolio Data Freshness Watchdog

on:
  workflow_dispatch:
  # 06:00 and 17:00 Asia/Taipei, after the US and Taiwan update windows.
  schedule:
    - cron: "0 22 * * 0-4"
    - cron: "0 9 * * 1-5"

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install watchdog dependency
        run: python -m pip install requests
      - name: Check Growth and Skynet freshness
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python health_check.py
