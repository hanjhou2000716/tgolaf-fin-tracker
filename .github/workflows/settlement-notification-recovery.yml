name: Recover Settlement Notification

on:
  workflow_run:
    workflows: ["Tranquil Growth Web App Deployment"]
    types: [completed]

concurrency:
  group: growth-dashboard
  queue: max

permissions:
  actions: read
  contents: read

jobs:
  recover-notification:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Download only the source run's private outbox
        id: outbox
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .private-build
          if gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_REPOSITORY" --name settlement-notification-outbox --dir .private-build; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No recoverable same-run settlement outbox was produced."
          fi
      - name: Recover notification without recalculating the ledger
        if: steps.outbox.outputs.available == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          CURRENT_TRANSACTION_SPREADSHEET_ID: ${{ vars.CURRENT_TRANSACTION_SPREADSHEET_ID || '' }}
          LEGACY_TRANSACTION_SPREADSHEET_ID: ${{ vars.LEGACY_TRANSACTION_SPREADSHEET_ID || '' }}
          CURRENT_TRANSACTION_SOURCE: ${{ vars.CURRENT_TRANSACTION_SOURCE || 'TRANSACTIONS_CURRENT' }}
          LEGACY_TRANSACTION_SOURCES: ${{ vars.LEGACY_TRANSACTION_SOURCES || '表單回覆 3,Form Responses 1,Form Responses 2,Form V2' }}
          HISTORY_SOURCE: ${{ vars.HISTORY_SOURCE || 'History' }}
          RECOVERY_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python recover_settlement_notification.py
      - name: Upload non-sensitive recovery result
        if: always() && steps.outbox.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notification-recovery-result
          path: .private-build/notification-recovery-result.json
          if-no-files-found: ignore

  recover-publication:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages_config.outputs.base_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Configure GitHub Pages
        id: pages_config
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked publisher dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Download only the failed run's public artifact
        id: source_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p public-site .private-build
          if gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_REPOSITORY" --name public-site --dir public-site; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No trusted public artifact exists; publication recovery is not applicable."
          fi
      - name: Verify original artifact and issue a unique recovery identity
        if: steps.source_artifact.outputs.available == 'true'
        env:
          RECOVERY_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python pages_publication.py prepare-republication public-site
          --source-run-id "$RECOVERY_SOURCE_RUN_ID"
          --source-commit "$RECOVERY_SOURCE_COMMIT"
      - name: Create Pages deployment artifact
        if: steps.source_artifact.outputs.available == 'true'
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v3.0.1
        with:
          path: ./public-site
      - name: Publish the existing public data without recalculating or notifying
        if: steps.source_artifact.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ steps.pages_config.outputs.base_url }}
          PUBLICATION_SUMMARY_PATH: .private-build/pages-publication-recovery-summary.json
        run: python pages_publication.py publish-and-verify public-site
      - name: Upload non-sensitive publication recovery result
        if: always() && steps.source_artifact.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-recovery-result
          path: .private-build/pages-publication-recovery-summary.json
          if-no-files-found: ignore
