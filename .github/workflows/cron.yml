name: Tranquil Growth Web App Deployment

on:
  repository_dispatch:
    types: [trigger_update]
  workflow_dispatch:
    inputs:
      force_telegram:
        description: "Force a Telegram settlement notification"
        required: false
        default: false
        type: boolean
      recover_missing_email:
        description: "One-time recovery for existing current-form rows created before email collection"
        required: false
        default: false
        type: boolean
  # GitHub cron is UTC. These are Taiwan time 05:40 (Tue-Sat) and
  # 14:45 (Mon-Fri), kept as a fallback when the external Cornjob misses.
  schedule:
    - cron: "40 21 * * 1-5"
    - cron: "45 6 * * 1-5"

concurrency:
  group: growth-dashboard
  # Only one Pages deployment may be active at a time. GitHub Pages identifies
  # deployments by the commit SHA, so a newer run must cancel an older run
  # before it attempts to publish the same revision.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Run formula and data validation tests
        run: python -m unittest discover -s tests -v

      - name: Run Tracker Script (Generate private snapshot and public Demo)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FORCE_TELEGRAM: ${{ inputs.force_telegram || false }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          SUPABASE_PRIVATE_SYNC_REQUIRED: ${{ secrets.SUPABASE_PRIVATE_SYNC_REQUIRED || 'false' }}
          FORM_SCHEMA_STRICT: ${{ secrets.FORM_SCHEMA_STRICT || 'true' }}
          FORM_SCHEMA_LEGACY_COMPAT: ${{ secrets.FORM_SCHEMA_LEGACY_COMPAT || 'true' }}
          FORM_MISSING_EMAIL_COMPAT: ${{ inputs.recover_missing_email || false }}
          FORM_V3_URL: ${{ vars.FORM_V3_URL || 'https://forms.google.com/' }}
          FORM_V3_CUTOVER_AT: ${{ vars.FORM_V3_CUTOVER_AT || '' }}
          CURRENT_TRANSACTION_SPREADSHEET_ID: ${{ vars.CURRENT_TRANSACTION_SPREADSHEET_ID || '' }}
          LEGACY_TRANSACTION_SPREADSHEET_ID: ${{ vars.LEGACY_TRANSACTION_SPREADSHEET_ID || '' }}
          CURRENT_TRANSACTION_SOURCE: ${{ vars.CURRENT_TRANSACTION_SOURCE || 'TRANSACTIONS_CURRENT' }}
          LEGACY_TRANSACTION_SOURCES: ${{ vars.LEGACY_TRANSACTION_SOURCES || '表單回覆 3,Form Responses 1,Form Responses 2,Form V2' }}
          HISTORY_SOURCE: ${{ vars.HISTORY_SOURCE || 'History' }}
        run: python main.py

      - name: Upload private schema recovery summary
        # This artifact contains only fingerprints, row counts and control
        # states.  It deliberately excludes private snapshots, holdings and
        # monetary values while making recovery decisions auditable.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema-recovery-summary
          path: .private-build/schema-recovery-summary.json
          if-no-files-found: error

      - name: Upload private ledger conflict summary
        # Non-financial conflict evidence only. Full immutable payloads stay
        # in the private build directory and are never uploaded or published.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ledger-conflict-summary
          path: .private-build/ledger-conflict-summary.json
          if-no-files-found: error

      - name: Verify generated public Demo is sanitized
        run: |
          test -s public-site/index.html
          test -s public-site/data.public.json
          test -s public-site/status.json
          test ! -e public-site/data.json
          # The private Telegram shell may contain safe holding labels and
          # fetches values only after API authentication. Scan only the public
          # demo contract for portfolio markers.
          if grep -Eqi '006208|QQQM|2330|TSM|NT\$[0-9]' public-site/index.html public-site/data.public.json public-site/status.json; then
            echo "Public Demo contains private portfolio markers"
            exit 1
          fi
          if grep -Eqi 'SUPABASE_SERVICE_ROLE_KEY|service_role_key' public-site/index.html public-site/data.public.json public-site/status.json public-site/private/index.html; then
            echo "Public site contains a service role marker"
            exit 1
          fi
          python -m json.tool public-site/data.public.json > /dev/null
          python -m json.tool public-site/status.json > /dev/null

      - name: Prepare static Pages artifact
        # The site is a static artifact (including the authenticated Telegram
        # shell). Disable legacy Jekyll processing so a valid HTML/CSS change
        # cannot leave Pages serving the previous deployment after a build
        # parser error.
        run: touch public-site/.nojekyll

      - name: Upload public site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-site
          path: public-site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download public site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-site
          path: public-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v3.0.1
        with:
          path: ./public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v4.0.5
