name: Tranquil Growth Web App Deployment

on:
  repository_dispatch:
    types: [trigger_update]
  workflow_dispatch:
    inputs:
      force_telegram:
        description: "Force a Telegram settlement notification"
        required: false
        default: false
        type: boolean
      notification_mode:
        description: "Disable Telegram only for an explicitly non-notifying validation run"
        required: false
        default: enabled
        type: choice
        options:
          - enabled
          - disabled
      recover_missing_email:
        description: "One-time recovery for existing current-form rows created before email collection"
        required: false
        default: false
        type: boolean
  # GitHub cron is UTC. These are delayed Taiwan fallbacks at 06:20
  # (Tue-Sat) and 15:25 (Mon-Fri); the gate skips them after a successful
  # primary/manual run for the same Taiwan date, window and commit.
  schedule:
    - cron: "20 22 * * 1-5"
    - cron: "25 7 * * 1-5"

concurrency:
  group: growth-dashboard
  # Queue the fallback behind an in-flight primary run; cancelling the primary
  # could leave a valid update half-written and force an unnecessary replay.
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  gate:
    name: Conditional fallback gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.schedule_gate.outputs.should_run }}
      window: ${{ steps.schedule_gate.outputs.window }}
      snapshot_date: ${{ steps.schedule_gate.outputs.snapshot_date }}
      reason_code: ${{ steps.schedule_gate.outputs.reason_code }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Evaluate fallback gate
        id: schedule_gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python schedule_gate.py

      - name: Upload schedule gate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: growth-schedule-gate-summary
          path: .private-build/schedule-gate-summary.json
          if-no-files-found: error

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      pages_base_url: ${{ steps.pages_config.outputs.base_url }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure GitHub Pages
        id: pages_config
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Install locked test dependencies
        run: python -m pip install --requirement requirements-test.lock

      - name: Run formula and data validation tests
        run: python -m unittest discover -s tests -v

      - name: Restore latest validated quarterly risk policy
        # Only successful runs from main can seed the next private state. A
        # missing artifact is a safe cold start and causes automatic rebuild.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .risk-policy-cache .private-build
          for previous_run in $(gh run list --workflow cron.yml --branch main --status success --limit 50 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$previous_run" --name quarterly-risk-policy-state --dir .risk-policy-cache; then
              echo "Restored quarterly risk state from successful main run $previous_run"
              break
            fi
          done

      - name: Download latest validated TAIEX cache
        # actions/download-artifact only sees artifacts from this run.  Use
        # the read-only Actions API to fetch the most recent successful cache
        # before the tracker runs; a missing cache is a safe cold start.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .taiex-cache
          for previous_run in $(gh run list --workflow cron.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$previous_run" --name taiex-history-cache --dir .taiex-cache; then
              break
            fi
          done

      - name: Run Tracker Script (Generate private snapshot and public Demo)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SEND_ENABLED: ${{ inputs.notification_mode != 'disabled' }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FORCE_TELEGRAM: ${{ inputs.force_telegram || false }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          SUPABASE_PRIVATE_SYNC_REQUIRED: ${{ secrets.SUPABASE_PRIVATE_SYNC_REQUIRED || 'false' }}
          FORM_SCHEMA_STRICT: ${{ secrets.FORM_SCHEMA_STRICT || 'true' }}
          FORM_SCHEMA_LEGACY_COMPAT: ${{ secrets.FORM_SCHEMA_LEGACY_COMPAT || 'true' }}
          FORM_MISSING_EMAIL_COMPAT: ${{ inputs.recover_missing_email || false }}
          FORM_V3_URL: ${{ vars.FORM_V3_URL || 'https://forms.google.com/' }}
          FORM_V3_CUTOVER_AT: ${{ vars.FORM_V3_CUTOVER_AT || '' }}
          SHEETS_OPERATION_SUMMARY_PATH: .private-build/google-sheets-operation-summary.json
          CURRENT_TRANSACTION_SPREADSHEET_ID: ${{ vars.CURRENT_TRANSACTION_SPREADSHEET_ID || '' }}
          LEGACY_TRANSACTION_SPREADSHEET_ID: ${{ vars.LEGACY_TRANSACTION_SPREADSHEET_ID || '' }}
          CURRENT_TRANSACTION_SOURCE: ${{ vars.CURRENT_TRANSACTION_SOURCE || 'TRANSACTIONS_CURRENT' }}
          LEGACY_TRANSACTION_SOURCES: ${{ vars.LEGACY_TRANSACTION_SOURCES || '表單回覆 3,Form Responses 1,Form Responses 2,Form V2' }}
          HISTORY_SOURCE: ${{ vars.HISTORY_SOURCE || 'History' }}
          TAIEX_HISTORY_CACHE_PATH: .taiex-cache/taiex-history-cache.json
          RISK_POLICY_STATE_DIR: .risk-policy-cache
          RISK_CANDIDATE_OUTPUT_DIR: .private-build
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_WINDOW_OVERRIDE: ${{ needs.gate.outputs.window }}
          SCHEDULED_DATE_OVERRIDE: ${{ needs.gate.outputs.snapshot_date }}
        run: python main.py

      - name: Record private settlement health for fallback gate
        if: always()
        env:
          SCHEDULED_WINDOW_OVERRIDE: ${{ needs.gate.outputs.window }}
          SCHEDULED_DATE_OVERRIDE: ${{ needs.gate.outputs.snapshot_date }}
        run: python settlement_health.py

      - name: Upload private notification delivery outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: settlement-notification-result
          path: .private-build/settlement-notification-result.json
          if-no-files-found: ignore

      - name: Upload private settlement notification outbox
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: settlement-notification-outbox
          path: .private-build/settlement-notification-outbox.enc.json
          retention-days: 2
          if-no-files-found: ignore

      - name: Upload private settlement health marker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: settlement-health
          path: .private-build/settlement-health.json
          if-no-files-found: ignore

      - name: Upload quarterly risk policy state
        if: always()
        # Contains validated public-market research inputs and versioned
        # parameters only; it is a private Actions artifact, never Pages data.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quarterly-risk-policy-state
          path: .risk-policy-cache
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload quarterly risk policy diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quarterly-risk-policy-summary
          path: .private-build/quarterly-risk-policy-summary.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload Google Sheets operation summary
        if: always()
        # Availability diagnostics contain only operation names, status codes,
        # retry counts and error types; never worksheet values or finance data.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-sheets-operation-summary
          path: .private-build/google-sheets-operation-summary.json
          if-no-files-found: ignore

      - name: Upload private schema recovery summary
        # This artifact contains only fingerprints, row counts and control
        # states.  It deliberately excludes private snapshots, holdings and
        # monetary values while making recovery decisions auditable.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema-recovery-summary
          path: .private-build/schema-recovery-summary.json
          if-no-files-found: error

      - name: Upload private ledger conflict summary
        # Non-financial conflict evidence only. Full immutable payloads stay
        # in the private build directory and are never uploaded or published.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ledger-conflict-summary
          path: .private-build/ledger-conflict-summary.json
          if-no-files-found: error

      - name: Upload private Buy&Hold market-data summary
        # Source, freshness, and row-count diagnostics only.  No price series
        # or portfolio values are published as a Pages artifact.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buyhold-market-data-summary
          path: .private-build/buyhold-market-data-summary.json
          if-no-files-found: error

      - name: Upload private NAV Beta audit
        # The audit contains the formal status, coverage and contribution
        # contract.  It is private Actions evidence and is never copied into
        # the Pages artifact.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nav-beta-audit
          path: .private-build/nav-beta-audit.json
          if-no-files-found: error

      - name: Upload private quarterly Kelly candidate
        # Candidate parameters and source-quality evidence are private audit
        # evidence; validated values auto-activate only after formula checks.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kelly-quarterly-candidate
          path: .private-build/kelly-quarterly-candidate*.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload private quarterly Beta candidate
        # Per-symbol estimates are private audit evidence and enter the active
        # policy only after source checks and live portfolio coverage pass.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-policy-candidate
          path: .private-build/beta-policy-candidate*.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload validated TAIEX history cache
        # Full index sessions are private market data, never part of Pages.
        # A mismatch or unavailable run produces no cache and cannot poison
        # the last validated artifact.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taiex-history-cache
          path: .private-build/taiex-history-cache.json
          if-no-files-found: ignore

      - name: Verify generated public Demo is sanitized
        run: |
          test -s public-site/index.html
          test -s public-site/data.public.json
          test -s public-site/status.json
          test ! -e public-site/data.json
          # The private Telegram shell may contain safe holding labels and
          # fetches values only after API authentication. Scan only the public
          # demo contract for portfolio markers.
          if grep -Eqi '006208|QQQM|2330|TSM|NT\$[0-9]' public-site/index.html public-site/data.public.json public-site/status.json; then
            echo "Public Demo contains private portfolio markers"
            exit 1
          fi
          if grep -Eqi 'SUPABASE_SERVICE_ROLE_KEY|service_role_key' public-site/index.html public-site/data.public.json public-site/status.json public-site/private/index.html; then
            echo "Public site contains a service role marker"
            exit 1
          fi
          python -m json.tool public-site/data.public.json > /dev/null
          python -m json.tool public-site/status.json > /dev/null

      - name: Prepare static Pages artifact
        # The site is a static artifact (including the authenticated Telegram
        # shell). Disable legacy Jekyll processing so a valid HTML/CSS change
        # cannot leave Pages serving the previous deployment after a build
        # parser error.
        run: touch public-site/.nojekyll

      - name: Stamp public artifact with publication identity and content hashes
        env:
          PUBLICATION_WINDOW: ${{ needs.gate.outputs.window }}
          PUBLICATION_WINDOW_DATE: ${{ needs.gate.outputs.snapshot_date }}
        run: python pages_publication.py prepare public-site

      - name: Upload public site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-site
          path: public-site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download public site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-site
          path: public-site

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v3.0.1
        with:
          path: ./public-site

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ needs.build.outputs.pages_base_url }}
          PUBLICATION_SUMMARY_PATH: .private-build/pages-publication-summary.json
        run: python pages_publication.py publish-and-verify public-site

      - name: Upload private Pages publication verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-publication-deployment-summary
          path: .private-build/pages-publication-summary.json
          if-no-files-found: ignore

  verify-publication:
    name: Independently verify live Pages content
    needs: [build, deploy]
    if: needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout read-only verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Download the exact public artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-site
          path: public-site

      - name: Verify live manifest and public content again
        env:
          PAGES_BASE_URL: ${{ needs.build.outputs.pages_base_url }}
          PUBLICATION_SUMMARY_PATH: .private-build/pages-publication-verification.json
        run: python pages_publication.py verify-live public-site

      - name: Upload independent publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-publication-verification
          path: .private-build/pages-publication-verification.json
          if-no-files-found: ignore

  verify-settlement-completion:
    name: Verify settlement notification receipt
    needs: [gate, build, deploy, verify-publication]
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Download notification outcome
        if: needs.build.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .private-build
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name settlement-notification-result --dir .private-build
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name settlement-health --dir .private-build
      - name: Require complete stages for scheduled windows
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLICATION_RESULT: ${{ needs.verify-publication.result }}
          REQUIRE_NOTIFICATION: ${{ needs.gate.outputs.window != '' }}
          EXPECTED_DATE: ${{ needs.gate.outputs.snapshot_date }}
          EXPECTED_WINDOW: ${{ needs.gate.outputs.window }}
        run: python workflow_completion.py
