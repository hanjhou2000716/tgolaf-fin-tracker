name: Tranquil Growth Web App Deployment

on:
  repository_dispatch:
    types: [trigger_update]
  workflow_dispatch:
    inputs:
      force_telegram:
        description: "Force a Telegram settlement notification"
        required: false
        default: false
        type: boolean

concurrency:
  group: growth-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Run formula and data validation tests
        run: python -m unittest discover -s tests -v

      - name: Run Tracker Script (Generate private snapshot and public Demo)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FORCE_TELEGRAM: ${{ inputs.force_telegram || false }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          SUPABASE_PRIVATE_SYNC_REQUIRED: ${{ secrets.SUPABASE_PRIVATE_SYNC_REQUIRED || 'false' }}
          FORM_SCHEMA_STRICT: ${{ secrets.FORM_SCHEMA_STRICT || 'true' }}
          FORM_SCHEMA_LEGACY_COMPAT: ${{ secrets.FORM_SCHEMA_LEGACY_COMPAT || 'true' }}
        run: python main.py

      - name: Verify generated public Demo is sanitized
        run: |
          test -s public-site/index.html
          test -s public-site/data.public.json
          test -s public-site/status.json
          test ! -e public-site/data.json
          # The private Telegram shell may contain safe holding labels and
          # fetches values only after API authentication. Scan only the public
          # demo contract for portfolio markers.
          if grep -Eqi '006208|QQQM|2330|TSM|NT\$[0-9]' public-site/index.html public-site/data.public.json public-site/status.json; then
            echo "Public Demo contains private portfolio markers"
            exit 1
          fi
          if grep -Eqi 'SUPABASE_SERVICE_ROLE_KEY|service_role_key' public-site/index.html public-site/data.public.json public-site/status.json public-site/private/index.html; then
            echo "Public site contains a service role marker"
            exit 1
          fi
          python -m json.tool public-site/data.public.json > /dev/null
          python -m json.tool public-site/status.json > /dev/null

      - name: Prepare static Pages artifact
        # The site is a static artifact (including the authenticated Telegram
        # shell). Disable legacy Jekyll processing so a valid HTML/CSS change
        # cannot leave Pages serving the previous deployment after a build
        # parser error.
        run: touch public-site/.nojekyll

      - name: Upload public site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-site
          path: public-site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download public site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-site
          path: public-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v3.0.1
        with:
          path: ./public-site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v4.0.5
