name: Tranquil Growth Web App Deployment

on:
  repository_dispatch:
    types: [trigger_update]
  workflow_dispatch:
    inputs:
      force_telegram:
        description: '強制發送一次 Telegram 結算通知（忽略時間窗口與去重）'
        required: false
        default: false
        type: boolean
  # 如果您需要每天自動執行，可以把下面兩行的註解(#)拿掉
  # schedule:
  #   - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: growth-dashboard
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance gspread google-auth

      - name: Run formula and data validation tests
        run: python -m unittest discover -s tests -v

      - name: Run Tracker Script (Generate private snapshot and public Demo)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FORCE_TELEGRAM: ${{ inputs.force_telegram || false }}
        run: python main.py
      - name: Verify generated public Demo is sanitized
        run: |
          test -s public-site/index.html
          test -s public-site/data.public.json
          test -s public-site/status.json
          test ! -e public-site/data.json
          if grep -Eqi 'totalAsset|assetTree|netAsset|006208|QQQM|2330|TSM|NT\$[0-9]' public-site/index.html public-site/data.public.json; then
            echo "Public Demo contains private portfolio markers"
            exit 1
          fi
          python -m json.tool public-site/data.public.json > /dev/null
          python -m json.tool public-site/status.json > /dev/null
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-site
          publish_branch: gh-pages
          force_orphan: true
